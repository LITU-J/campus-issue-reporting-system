<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CampusCare Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>CampusCare</h2>
                <span>Admin Dashboard</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="report-issue.html">Report Issue</a></li>
                <li><a href="view-issues.html">View Issues</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="dashboard">
            <h1>Analytics Dashboard</h1>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>Total Reports</h3>
                    <div class="stat-value" id="dashTotal">0</div>
                </div>
                <div class="stat-card pending">
                    <h3>Pending Review</h3>
                    <div class="stat-value" id="dashPending">0</div>
                </div>
                <div class="stat-card progress">
                    <h3>In Progress</h3>
                    <div class="stat-value" id="dashProgress">0</div>
                </div>
                <div class="stat-card resolved">
                    <h3>Completed</h3>
                    <div class="stat-value" id="dashResolved">0</div>
                </div>
            </div>

            <div class="dashboard-charts">
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>

            <div class="recent-issues">
                <h2>📋 Recent Activity</h2>
                <div id="recentIssuesList"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 CampusCare — Making Campuses Better Together</p>
    </footer>

    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
