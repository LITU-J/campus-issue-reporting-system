<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - CampusCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>CampusCare</h2>
                <span>Issue Reporting System</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="report-issue.html" class="active">Report Issue</a></li>
                <li><a href="view-issues.html">View Issues</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="form-container">
            <h1>Report an Issue</h1>
            <p class="form-description">Please provide detailed information about the issue you've encountered. The more details you share, the faster we can resolve it.</p>
            
            <form id="issueForm" class="issue-form">
                <div class="form-group">
                    <label for="reporterName">Full Name *</label>
                    <input type="text" id="reporterName" name="reporterName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="studentId">Student/Staff ID *</label>
                    <input type="text" id="studentId" name="studentId" placeholder="e.g., STU12345" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="you@university.edu" required>
                </div>

                <div class="form-group">
                    <label for="issueType">Issue Category *</label>
                    <select id="issueType" name="issueType" required>
                        <option value="">Select a category</option>
                        <option value="facility">🏢 Facility Maintenance</option>
                        <option value="cleaning">🧹 Cleaning/Housekeeping</option>
                        <option value="safety">⚠️ Safety Concern</option>
                        <option value="electrical">⚡ Electrical Problem</option>
                        <option value="plumbing">🚰 Plumbing Issue</option>
                        <option value="it">💻 IT/Technology Issue</option>
                        <option value="other">📌 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Science Building, Room 301, 2nd Floor" required>
                </div>

                <div class="form-group">
                    <label for="title">Issue Title *</label>
                    <input type="text" id="title" name="title" placeholder="Brief summary of the issue" required>
                </div>

                <div class="form-group">
                    <label for="description">Detailed Description *</label>
                    <textarea id="description" name="description" rows="5" placeholder="Please provide as much detail as possible about the issue..."></textarea>
                </div>

                <div class="form-group">
                    <label for="urgency">Urgency Level *</label>
                    <select id="urgency" name="urgency" required>
                        <option value="low">🟢 Low - Can be addressed within a week</option>
                        <option value="medium">🟡 Medium - Needs attention in 2-3 days</option>
                        <option value="high">🟠 High - Urgent, needs immediate attention</option>
                        <option value="critical">🔴 Critical - Emergency situation</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">✓ Submit Report</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 CampusCare — Making Campuses Better Together</p>
    </footer>

    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
