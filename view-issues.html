<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Issues - CampusCare</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">🏫</div>
                <h2>CampusCare</h2>
                <span>Smart Issue Tracker</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">✨ Home</a></li>
                <li><a href="report-issue.html">📝 Report</a></li>
                <li><a href="view-issues.html" class="active">👀 Issues</a></li>
                <li><a href="dashboard.html">📊 Dashboard</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="issues-container">
            <h1>📋 All Reported Issues</h1>
            
            <div class="filters">
                <select id="statusFilter">
                    <option value="all">📌 All Status</option>
                    <option value="pending">⏳ Pending</option>
                    <option value="in-progress">🔄 In Progress</option>
                    <option value="resolved">✅ Resolved</option>
                </select>
                <select id="typeFilter">
                    <option value="all">📁 All Categories</option>
                    <option value="facility">🏢 Facility</option>
                    <option value="cleaning">🧹 Cleaning</option>
                    <option value="safety">⚠️ Safety</option>
                    <option value="electrical">⚡ Electrical</option>
                    <option value="plumbing">🚰 Plumbing</option>
                    <option value="it">💻 IT</option>
                </select>
                <input type="text" id="searchInput" placeholder="🔍 Search issues...">
            </div>

            <div class="issues-list" id="issuesList">
                <div class="loading">Loading issues...</div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2024 CampusCare — Making Campuses Better Together ✨</p>
    </footer>

    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
